---
layout: default
---

<h1>{{ page.title }}</h1>
<div class="article-meta">
  <time datetime="{{ page.date | date: "%F" }}">{{ page.date | date: "%b %Y" }}</time>
  {% if page.description %}
    &nbsp;·&nbsp;{{ page.description }}
  {% endif %}
</div>

<article class="prose">
  {{ content }}
</article>
