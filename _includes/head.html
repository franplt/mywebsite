{% assign meta_title = page.meta_title | default: page.title | default: site.title %}
{% if meta_title != site.title %}
  {% assign meta_title = meta_title | append: " — " | append: site.title %}
{% endif %}
{% assign meta_description = page.description | default: site.description %}

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ meta_title }}</title>
<meta name="description" content="{{ meta_description | escape }}" />
<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{{ meta_title }}" />
<meta property="og:description" content="{{ meta_description | escape }}" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta property="og:type" content="website" />

<link rel="alternate" type="application/rss+xml" href="/rss.xml" title="{{ site.title }} — Articles" />
<link rel="sitemap" type="application/xml" href="/sitemap.xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/styles.css" />
